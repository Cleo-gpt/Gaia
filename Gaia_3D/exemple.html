<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Exemple Gaia</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fbefe6; margin: 0; padding: 24px; }
    /* La bouteille prend la taille de cette div : donne-lui une hauteur */
    #bouteille { width: 100%; max-width: 600px; height: 560px; margin: 0 auto; }
    .controles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div id="bouteille"></div>

  <div class="controles">
    <button id="secouer">Secouer</button>
    <button id="redresser">Redresser</button>
    <button id="pencher">Mode pencher</button>
    <button id="deplacer">Mode déplacer</button>
  </div>

  <script src="gaia-bottle.js"></script>
  <script>
    const bouteille = GaiaBottle.mount('#bouteille', {
      mode: 'tilt',     // 'tilt' = pencher, 'move' = déplacer
      upright: true,    // revient debout quand on lâche
      spin: true,       // tourne doucement sur elle-même
      shadow: true,     // ombre sous la bouteille
      zoom: 1           // 1.2 = plus grande, 0.8 = plus petite
    });

    document.getElementById('secouer').onclick   = () => bouteille.shake();
    document.getElementById('redresser').onclick = () => bouteille.reset();
    document.getElementById('pencher').onclick   = () => bouteille.setMode('tilt');
    document.getElementById('deplacer').onclick  = () => bouteille.setMode('move');
  </script>
</body>
</html>
